title:
  english: Introduction
  coptic: Ⲭⲉⲣⲉ ⲛⲉ ⲧⲉⲛϯϩⲟ ⲉ̀ⲣⲟ
  arabic: المقدمة
sections:
  - speaker: people
    type: verses
    verses:
      - english: In Christ Jesus our Lord. Amen alleluia
        arabic: 'بِالْمَسِيحِ يَسُوعَ رَبِّنَا: آمِينَ هَلِلُويَا.'
        coptic: Ϧⲉⲛ Ⲡⲭ̅ⲥ̅ Ⲓⲏ̅ⲥ̅ ⲡⲉⲛⲟ̅ⲥ̅. Ⲁⲙⲏⲛ ⲁ̅ⲗ̅
        coptic_english: Khen Pikhristos Eesos Penchois. Ameen Alleluya
        coptic_arabic: 'خين بخريستوس إيسوس بين تشويس: أمين الليلويا.'
      - english: Hail to you. We ask you, O saint full of glory, the ever-virgin, the Theotokos, the Mother of Christ
        arabic: 'اَلسَّلَامُ لَكِ نَسْأَلُكِ: أَيَّتُهَا اَلْقِدِّيسَةُ اَلْمُمْتَلِئَةُ مَجْدًا: اَلْعَذْرَاءُ كُلَّ حِينٍ: وَالِدَةُ اَلإِلَهِ أُمُّ اَلْمَسِيحِ.'
        coptic: 'Ⲭⲉⲣⲉ ⲛⲉ ⲧⲉⲛϯϩⲟ ⲉ̀ⲣⲟ: ⲱ̀ ⲑⲏⲉ̅ⲑ̅ⲩ̅ ⲉⲑⲙⲉϩ ⲛ̀ⲱ̀ⲟⲩ: ⲉ̀ⲧⲟⲓ ⲙ̀Ⲡⲁⲣⲑⲉⲛⲟⲥ ⲛ̀ⲥⲏⲟⲩ ⲛⲓⲃⲉⲛ: ϯⲙⲁⲥⲛⲟⲩϯ ⲑ̀ⲙⲁⲩ ⲙ̀Ⲡⲭ̅ⲥ̅'
        coptic_english: |-
          Shere ne tenteeho ero: o the- ethowarab ethmeh eno-ou:
          etoy emparthenos enseyou niven: teemacnotee ethmav empikhristos
        coptic_arabic: 'شيري ني تينتي طوبه إيرؤ: أو ثي إثؤواب إثمي إم أؤو: إتوي پارثينوس إن سيهؤو نيڤين: تي ماسنوتى ثي ماف إمپيخريستوس.'
      - english: Lift up our prayers, unto your beloved Son, that He may forgive us our sins
        arabic: 'اِصْعَدِي صَلَاتَنَا: إِلَى ابْنِكِ اَلْحَبِيبِ: لِيَغْفِرَ لَنَا خَطَايَانَا.'
        coptic: 'Ⲁⲛⲓⲟⲩⲓ̀ ⲛ̀ⲧⲉⲡ̀ⲣⲟⲥⲉ̀ⲩⲭⲏ: ⲉ̀ⲡ̀ϣⲱⲓ ϩⲁ ⲡⲉϣⲏⲣⲓ ⲙ̀ⲙⲉⲛⲣⲓⲧ: ⲛ̀ⲧⲉϥⲭⲁ ⲛⲉⲛⲛⲟⲃⲓ ⲛⲁⲛ ⲉ̀ⲃⲟⲗ'
        coptic_english: |-
          Anioyi enten-eprosevshi: epshoi ha pesheeri em-menreet:
          entef ka nennovi nan evol
        coptic_arabic: 'آني أوي إنتين پروسيفخي: إپ شؤي ها پيشيري إممينريت: إنتيف كا نين نوڤي نان إيڤول.'
      - english: Hail to the holy Virgin, who has brought forth unto us the true Light, Christ our God
        arabic: 'اَلسَّلَامُ لِلَّتِي وَلَدَتْ لَنَا: اَلنُّورَ اَلْحَقِيقِيَّ: اَلْمَسِيحَ إِلَهَنَا: اَلْعَذْرَاءَ اَلْقِدِّيسَةَ.'
        coptic: 'Ⲭⲉⲣⲉ ⲑⲏⲉ̀ⲧⲁⲥⲙⲓⲥⲓ ⲛⲁⲛ: ⲙ̀ⲡⲓⲞⲩⲱⲓⲛⲓ ⲛ̀ⲧⲁⲫ̀ⲙⲏⲓ: Ⲡⲭ̅ⲥ̅ ⲡⲉⲛⲚⲟⲩϯ: ϯⲠⲁⲣⲑⲉⲛⲟⲥ ⲉ̅ⲑ̅ⲩ̅'
        coptic_english: |-
          Shere the-etasmici nan: empio-oini enta-efmi:
          pikhristos pennotee: tee-parthenos ethowab
        coptic_arabic: 'شيري ثي إتاس ميسي نان: إمپي أوؤيني إنتى إفمي: پيخريستوس إفنوتى: تي پارثينوس إثؤواب.'
      - english: Ask the Lord on our behalf, the he may have mercy upon our souls, and forgive us our sins
        arabic: 'اِسْأَلِي اَلرَّبَّ عَنَّا: لِيَصْنَعَ رَحْمَةً مَعَ نُفُوسِنَا: وَيَغْفِرَ لَنَا خَطَايَانَا.'
        coptic: 'Ⲙⲁϯϩⲟ ⲙ̀Ⲡⲟ̅ⲥ̅ ⲉ̀ϩ̀ⲣⲏⲓ ⲉ̀ϫⲱⲛ: ⲛ̀ⲧⲉϥⲉ̀ⲣⲟⲩⲛⲁⲓ ⲛⲉⲙ ⲛⲉⲛⲯⲩⲭⲏ: ⲛ̀ⲧⲉϥⲭⲁ ⲛⲉⲛⲛⲟⲃⲓ ⲛⲁⲛ ⲉ̀ⲃⲟⲗ'
        coptic_english: |-
          Matiho em-epchois eh-ehri egon:
          entef-eronai nem nen-epseeshee:entef ka nennovi nan evol
        coptic_arabic: 'ماتي طوبه إمپ إتشويس إي إهرى إي چون: إنتيف إيرؤوناي نيم نينپسيشي: إنتيف كا نين نوڤي نان إيڤول.'
      - english: O Virgin Mary, the holy Theotokos, the faithful advocate for mankind
        arabic: 'أَيَّتُهَا اَلْعَذْرَاءُ مَرْيَمُ: وَالِدَةُ اَلإِلَهِ اَلْقِدِّيسَةُ: اَلشَّفِيعَةُ اَلْأَمِينَةُ: لِجِنْسِ اَلْبَشَرِ.'
        coptic: 'ϮⲠⲁⲣⲑⲉⲛⲟⲥ Ⲙⲁⲣⲓⲁⲙ: ϯⲑⲉⲟⲧⲟⲕⲟⲥ ⲉ̅ⲑ̅ⲩ̅: ϯⲡ̀ⲣⲟⲥⲧⲁⲧⲏⲥ ⲉ̀ⲧⲉⲛϩⲟⲧ: ⲛ̀ⲧⲉ ⲡ̀ⲅⲉⲛⲟⲥ ⲛ̀ⲧⲉ ϯⲙⲉⲧⲣⲱⲙⲓ'
        coptic_english: |-
          Teeparthenos Mariam: Teetheotokos ethowab:
          tee-eproctatees etenhot: ente epgenos ente teemetromi
        coptic_arabic: 'تي پارثينوس ماريام: تي ثيؤتوكوس إثؤواب: تي پروسطاتيس إيتين هوت: إنتى إپ جينوس إنتى تي ميت رومي.'
      - english: Intercede on our behalf before Christ to whom you bore, that He may grant us, the forgiveness of our sins
        arabic: 'اِشْفَعِي فِينَا: أَمَامَ اَلْمَسِيحِ: اَلَّذِي وَلَدْتِهِ: لِكَيْ يُنْعِمَ لَنَا: بِمَغْفِرَةِ خَطَايَانَا.'
        coptic: 'Ⲁⲣⲓⲡ̀ⲣⲉⲥⲃⲉⲩⲓⲛ ⲉ̀ϩ̀ⲣⲏⲓ ⲉϫⲱⲛ: ⲛⲁϩⲣⲉⲛ Ⲡⲭ̅ⲥ̅ ⲫⲏⲉ̀ⲧⲁⲣⲉ̀ϫⲫⲟϥ: ϩⲟⲡⲱⲥ ⲛ̀ⲧⲉϥⲉ̀ⲣϩ̀ⲙⲟⲧ ⲛⲁⲛ: ⲙ̀ⲡ̀ⲭⲱ ⲉ̀ⲃⲟⲗ ⲛ̀ⲧⲉ ⲛⲉⲛⲛⲟⲃⲓ'
        coptic_english: |-
          Ari-epresvevin e—ehri egon: nahren pikhristos the-etare-egfof:
          hobos entefer-ehmot nan: empiko evol ente nennovi
        coptic_arabic: 'آري إپريسڤيڤين إي إهرى إي چون: ناهتيرن پيخريستوس في إتار إچ إيفو: هوبوس إنتيف إيره موت نان: إمپي خو إيڤول إنتى نين نوڤي.'
      - english: Hail to you O Virgin, / the right and true queen, Hail to the pride of our race / who bore to us Immanuel
        arabic: 'اَلسَّلَامُ لَكِ أَيَّتُهَا اَلْعَذْرَاءُ: اَلْمَلِكَةُ اَلْحَقِيقِيَّةُ اَلْحَقَّانِيَّةُ: اَلسَّلَامُ لِفَخْرِ جِنْسِنَا: وَلَدْتِ لَنَا عِمَّانُوئِيلَ.'
        coptic: 'Ⲭⲉⲣⲉ ⲛⲉ ⲱ̀ ϯⲠⲁⲣⲑⲉⲛⲟⲥ: ϯⲟⲩⲣⲱ ⲙ̀ⲙⲏⲓ ⲛ̀ⲁ̀ⲗⲏⲑⲓⲛⲏ: ⲭⲉⲣⲉ ⲡ̀ϣⲟⲩϣⲟⲩ: ⲛ̀ⲧⲉ ⲡⲉⲛⲅⲉⲛⲟⲥ: ⲁⲣⲉϫ̀ⲫⲟ ⲛⲁⲛ ⲛ̀Ⲉⲙⲙⲁⲛⲟⲩⲏⲗ'
        coptic_english: |-
          Shere ne-o teeparthenos: tee-orou em-mee en-aleetheeni:
          Shere ebshou-shou ente bengennos: are-egfou nan enemmano-eel
        coptic_arabic: 'شيري ني أو تي پارثينوس: تي أورو إممى إن أليثيني: شيري إپ شؤوشؤو إنتى پين جينوس: آري إچ إيفو نان إن إممانوئيل.'
      - english: We ask you to remember us, / O our faithful advocate, / before our Lord Jesus Christ, / that He may forgive us our sins
        arabic: 'نَسْأَلُكِ اذْكُرِينَا: أَيَّتُهَا اَلشَّفِيعَةُ اَلْمُؤْتَمَنَةُ: أَمَامَ رَبِّنَا يَسُوعَ اَلْمَسِيحِ: لِيَغْفِرَ لَنَا خَطَايَانَا'
        coptic: 'Ⲧⲉⲛϯϩⲟ ⲁ̀ⲣⲉⲡⲉⲛⲙⲉⲩⲓ̀: ⲱ̀ ϯⲡ̀ⲣⲟⲥⲧⲁⲧⲏⲥ ⲉ̀ⲧⲉⲛϩⲟⲧ: ⲛⲁϩⲣⲉⲛ ⲡⲉⲛⲟ̅ⲥ̅ Ⲓⲏ̅ⲥ̅ Ⲡⲭ̅ⲥ̅: ⲛ̀ⲧⲉϥⲭⲁ ⲛⲉⲛⲛⲟⲃⲓ ⲛⲁⲛ ⲉ̀ⲃⲟⲗ'
        coptic_english: |-
          Tenteeho ari–penmevi: O tee-eprostatees etenhot:
          nahren penchois eesos pikhristos: entef ka nennovi nan evol
        coptic_arabic: 'تينتي طوبه آري پين ميفى: أو تي پروسطاتيس إيتين هوت: ناهتيرن پين تشويس إيسوس پيخريستوس: إنتيف كا نين نوڤي نان إيڤول.'
type: prayer
