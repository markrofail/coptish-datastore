title:
  english: Doxologies Conclusion
  coptic: Ϣⲱⲡⲓ ⲛ̀ⲑⲟ ⲉⲣⲉⲥⲟⲙⲥ ⲉϫⲱⲛ
  arabic: ختام الذكصولوجيات
sections:
  - speaker: people
    type: verses
    verses:
      english:
        - 'Watch over us: from on high where you dwell: O Lady of us all: the ever-virign Theotokos'
        - 'Ask of Him whom you have borne: our good Savior: to take away our troubles: and grant us His peace'
        - Hail to you O Virgin, / the right and true Queen, / Hail to the pride of our race, / who bore to us Immanuel
        - We ask you to remember us, / O our faithful advocate, before our Lord Jesus Christ, / that He may forgive us our sins
      arabic:
        - كونى أنتِ ناظرة علينا فى المواضع العالية التى أنتِ كائنة فيها يا سيدتنا كلنا والدة الإله العذراء كل حين.
        - إسألى الذي ولدته مخلصنا الصالح أن يرفع عنا هذه الأتعاب ويقرر لنا سلامه.
        - 'اَلسَّلَامُ لَكِ أَيَّتُهَا اَلْعَذْرَاءُ: اَلْمَلِكَةُ اَلْحَقِيقِيَّةُ اَلْحَقَّانِيَّةُ: اَلسَّلَامُ لِفَخْرِ جِنْسِنَا: وَلَدْتِ لَنَا عِمَّانُوئِيلَ.'
        - 'نَسْأَلُكِ اذْكُرِينَا: أَيَّتُهَا اَلشَّفِيعَةُ اَلْمُؤْتَمَنَةُ: أَمَامَ رَبِّنَا يَسُوعَ اَلْمَسِيحِ: لِيَغْفِرَ لَنَا خَطَايَانَا'
      coptic:
        - 'Ϣⲱⲡⲓ ⲛ̀ⲑⲟ ⲉ̀ⲣⲉ ⲥⲟⲙⲥ ⲉ̀ϫⲱⲛ: ϧⲉⲛ ⲛⲓⲙⲁ ⲉⲧϭⲟⲥⲓ ⲉ̀ⲧⲉⲣⲉⲭⲏ ⲛ̀ϧⲏⲧⲟⲩ: ⲱ̀ ⲧⲉⲛⲟ̅ⲥ̅ ⲛ̀ⲛⲏⲃ ⲧⲏⲣⲉⲛ ϯⲑⲉⲟ̀ⲧⲟⲕⲟⲥ: ⲉⲧⲟⲓ ⲙ̀Ⲡⲁⲣⲑⲉⲛⲟⲥ ⲛ̀ⲥⲏⲟⲩ ⲛⲓⲃⲉⲛ'
        - 'Ⲙⲁϯϩⲟ ⲙ̀ⲫⲏⲉ̀ⲧⲁⲣⲉⲙⲁⲥϥ: ⲡⲉⲛⲤⲱⲧⲏⲣ ⲛ̀ⲁ̀ⲅⲁⲑⲟⲥ: ⲛ̀ⲧⲉϥⲱ̀ⲗⲓ ⲛ̀ⲛⲁⲓϧⲓⲥⲓ ⲉ̀ⲃⲟⲗϩⲁⲣⲟⲛ: ⲛ̀ⲧⲉϥⲥⲉⲙⲛⲓ ⲛⲁⲛ ⲛ̀ⲧⲉϥϩⲓⲣⲏⲛⲏ'
        - 'Ⲭⲉⲣⲉ ⲛⲉ ⲱ̀ ϯⲠⲁⲣⲑⲉⲛⲟⲥ: ϯⲟⲩⲣⲱ ⲙ̀ⲙⲏⲓ: ⲛ̀ⲁ̀ⲗⲏⲑⲓⲛⲏ ⲭⲉⲣⲉ ⲡ̀ϣⲟⲩϣⲟⲩ ⲛ̀ⲧⲉ ⲡⲉⲛⲅⲉⲛⲟⲥ: ⲁ̀ⲣⲉϫ̀ⲫⲟ ⲛⲁⲛ ⲛ̀Ⲉⲙⲙⲁⲛⲟⲩⲏⲗ'
        - 'Ⲧⲉⲛϯϩⲟ ⲁ̀ⲣⲉⲡⲉⲛⲙⲉⲩⲓ̀: ⲱ̀ ϯⲡ̀ⲣⲟⲥⲧⲁⲧⲏⲥ ⲉ̀ⲧⲉⲛϩⲟⲧ: ⲛⲁϩⲣⲉⲛ ⲡⲉⲛⲟ̅ⲥ̅ Ⲓⲏ̅ⲥ̅ Ⲡⲭ̅ⲥ̅: ⲛ̀ⲧⲉϥⲭⲁ ⲛⲉⲛⲛⲟⲃⲓ ⲛⲁⲛ ⲉ̀ⲃⲟⲗ'
      coptic_english:
        - |-
          Shopi entho ere-coms egon: khen nima et-chosi et-arekhe enkheeto:
          o tenchois en-nef teeren tee-theotokos: etoy emparthenos en-seyo niven
        - |-
          Mat-ee-ho em-fe-etaremasf: Pensoteer en-aghathos:
          entef-oli enai-khici evol-haron: entefsemni-nan entef-hereenee
        - |-
          Shere ne o tee-Parthenos: tee-ourou em-mee en-alitheenee:
          shere ep-sho-sho ente pengennos: are-egfo nan en-emmanoeel
        - |-
          Tenteeho ari-penmevi: O tee-eproctatees etenhot:
          nahren penchois isos pikhristos: entefka nennovi nan evol
      coptic_arabic:
        - 'شوبي إنثو إريه سومس إجون : خين ني ما إتتشوسي إت إريه كي انخيتوو : أو تين تشويس إن نيب تيرين تي ثيؤطوكوس :إت أوى إمبارثينوس إنسيوو نيفين.'
        - 'ما تيهو إمفي إت أريه ماسف : بين سوتير إن أغاثوس : إنتيف أولي إن ناي خيسي إفول هارون : إنتيف سيمني نان إنتيف هيريني.'
        - 'شيريه نيه أو تي بارثينوس : تي أوورو إممي إن أليثيني : شيريه إبشووشوو إنتيه بين جينوس : أريه إجفو نان إن إممانوئيل.'
        - 'تين تيهو أري بي نميفي : أو تي بروستاتيس إتين هوت : ناهرين بينتشويس إيسوس بي خريستوس : إنتيف كا نين نوفي نان إفول.'
type: prayer
